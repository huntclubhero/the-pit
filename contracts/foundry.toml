[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 500
fuzz = { runs = 2000 }
invariant = { runs = 512, depth = 50, fail_on_revert = false }
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.ci]
fuzz = { runs = 20000 }
invariant = { runs = 2048, depth = 100 }

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

[etherscan]
robinhood = { key = "verifyContract", url = "https://robinhoodchain.blockscout.com/api/" }
