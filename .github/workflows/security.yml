name: security

# Contract security and test gate for THE PIT.
# Runs the full Foundry suite plus Slither and Aderyn static analysis on every
# push and pull request. The fork suite runs separately (needs a live RPC) and
# is non-blocking so a transient RPC outage does not fail the gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  foundry:
    name: build, fmt, test (fuzz + invariant)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build
        run: forge build --sizes

      - name: Format check
        run: forge fmt --check

      - name: Test (CI profile: 20k fuzz runs, deep invariants)
        run: forge test --no-match-contract ForkTest -vvv
        env:
          FOUNDRY_PROFILE: ci

  slither:
    name: slither static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Slither
        uses: crytic/slither-action@v0.4.0
        with:
          target: contracts
          slither-config: contracts/slither.config.json
          fail-on: high

  aderyn:
    name: aderyn static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install Aderyn
        run: curl -L https://raw.githubusercontent.com/Cyfrin/aderyn/dev/cyfrinup/install | bash && echo "$HOME/.cyfrin/bin" >> "$GITHUB_PATH"

      - name: Aderyn
        working-directory: contracts
        run: aderyn . --output aderyn-report.md

      - name: Upload Aderyn report
        uses: actions/upload-artifact@v4
        with:
          name: aderyn-report
          path: contracts/aderyn-report.md
